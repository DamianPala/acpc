name = "Codex CLI"
author = "OpenAI"
command = "codex-acp"
install_command = "npm install -g @agentclientprotocol/codex-acp"
home = "~/.codex"
home_env = "CODEX_HOME"
env_passthrough = [
    "CODEX_HOME",
    "CODEX_PATH",
    "CODEX_CONFIG",
    "MODEL_PROVIDER",
    "CODEX_API_KEY",
    "OPENAI_API_KEY",
    "INITIAL_AGENT_MODE",
]
# Verified live 2026-08-06: codex-acp advertises read-only / agent /
# agent-full-access. The default `agent` mode also auto-allows *workspace* edits
# and commands without a permission request, so a policy below `all` only bites
# in `read-only` mode; the vendor sandbox is the boundary everywhere else.
# Verified live 2026-08-06: codex-acp rejects minimal/ultra ("Invalid params").
efforts = ["low", "medium", "high", "xhigh"]

[modes]
read-only = { grants = "edit", delegates = false }
agent = { grants = "execute", delegates = false }
agent-full-access = { grants = "all", delegates = false }

[presets]
fast = { model = "gpt-5.6-luna", effort = "high" }
standard = { model = "gpt-5.6-terra", effort = "xhigh" }
max = { model = "gpt-5.6-sol", effort = "xhigh" }
