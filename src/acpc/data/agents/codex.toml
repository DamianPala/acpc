name = "Codex CLI"
author = "OpenAI"
command = "codex-acp"
install_command = "npm install -g @agentclientprotocol/codex-acp"
home = "~/.codex"
home_env = "CODEX_HOME"
usage_profile = "codex_usage_updates"
env_passthrough = [
    "CODEX_HOME",
    "CODEX_PATH",
    "CODEX_CONFIG",
    "MODEL_PROVIDER",
    "CODEX_API_KEY",
    "OPENAI_API_KEY",
    "INITIAL_AGENT_MODE",
]
# Measured by probe spike 2026-08-10 against codex-acp 1.1.9 / codex-cli
# 0.147.0 (docs/plans/0.6/spike-probe/REPORT.md). No mode delegates: zero
# request_permission calls across six runs. read-only is NOT a read-only
# boundary — writes land with nothing asked when the model routes through
# apply_patch (an in-vendor reviewer, "Guardian", approves them and the client
# sees only a `think` tool call); the same write through a shell redirect is
# denied by the sandbox. Treat `edit` as the measured floor, not a guarantee:
# read-only is the mode with the least predictable ceiling, not the safe one.
# Verified live 2026-08-06: codex-acp rejects minimal/ultra ("Invalid params").
# Preset models are guarded to the vendor's supported effort levels; unlisted
# models use the derived union as a fallback.

# `escalates = true` on read-only records exactly that: the in-vendor reviewer can
# raise the effective ceiling with nothing reaching acpc, so `grants` there is a
# measurement and not a bound.
[modes]
read-only = { grants = "edit", delegates = false, escalates = true }
agent = { grants = "execute", delegates = false }
agent-full-access = { grants = "all", delegates = false }

[presets]
fast = { model = "gpt-5.6-luna", effort = "high" }
standard = { model = "gpt-5.6-terra", effort = "xhigh" }
max = { model = "gpt-5.6-sol", effort = "xhigh" }

# gpt-6-astra, catalogue 2026-09-05: its API reference takes reasoning.effort
# low/medium/high/xhigh/max. The app-server catalogue also advertises `ultra`,
# which is the harness's delegation mode rather than an API level, so the row
# stops at max.
[effort_by_model]
"gpt-5.6-luna" = ["low", "medium", "high", "xhigh"]
"gpt-5.6-terra" = ["low", "medium", "high", "xhigh"]
"gpt-5.6-sol" = ["low", "medium", "high", "xhigh"]
"gpt-6-astra" = ["low", "medium", "high", "xhigh", "max"]
