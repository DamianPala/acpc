name = "Claude Code"
author = "Anthropic"
command = "claude-agent-acp"
install_command = "npm install -g @agentclientprotocol/claude-agent-acp"
home = "~/.claude"
home_env = "CLAUDE_CONFIG_DIR"
env_passthrough = [
    "CLAUDE_CONFIG_DIR",
    "CLAUDE_CODE_EXECUTABLE",
    "ANTHROPIC_BASE_URL",
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_AUTH_TOKEN",
    "ANTHROPIC_MODEL",
    "CLAUDE_CODE_USE_ANTHROPIC_AWS",
    "CLAUDE_CODE_USE_ANTHROPIC_GOOGLE_CLOUD",
    "CLAUDE_CODE_USE_BEDROCK",
    "CLAUDE_CODE_USE_FOUNDRY",
    "CLAUDE_CODE_USE_GATEWAY",
    "CLAUDE_CODE_USE_MANTLE",
    "CLAUDE_CODE_USE_VERTEX",
]
# Verified live 2026-08-06 against claude-agent-acp 0.64.0: the effort config
# option id is `effort` (the default `reasoning_effort` returns "Internal
# error: Unknown config option"), with these advertised values.
# Verified live 2026-08-07 by raw ACP probe against claude CLI 2.1.224: the
# effort option is model-dependent. Selecting claude-haiku-4-5 collapses the
# advertised options to mode/model/agent and any effort write then fails
# "Unknown config option: effort"; sonnet and opus keep it. The `fast` preset
# therefore pins the model only, and haiku runs at its own built-in level.
effort_config_id = "effort"
efforts = ["default", "low", "medium", "high", "xhigh", "max"]

# Measured by probe spike 2026-08-10 against claude-agent-acp 0.64.0 /
# Claude Code 2.1.226 (docs/plans/0.6/spike-probe/REPORT.md). Two corrections
# to the 2026-08-08 hand-written table:
# - `auto` ("model classifier approves permission prompts") answers in-vendor
#   and silently: it wrote inside and outside the workspace, ran shell and
#   reached the network with zero permission requests. It is `all` and does
#   not delegate — never treat it as a read-ceiling mode.
# - `plan` wrote an arbitrary file with no permission request after nudging;
#   it resists but is not a boundary. `edit` is the honest ceiling.
# `escalates = true` on auto records exactly that: the classifier can raise the
# effective ceiling with nothing reaching acpc, so `grants` there is a measurement
# and not a bound.
[modes]
default = { grants = "read", delegates = true }
plan = { grants = "edit", delegates = true }
auto = { grants = "all", delegates = false, escalates = true }
acceptEdits = { grants = "execute", delegates = true }
dontAsk = { grants = "none", delegates = false }
bypassPermissions = { grants = "all", delegates = false }

[presets]
fast = { model = "claude-haiku-4-5" }
standard = { model = "claude-sonnet-5", effort = "high" }
max = { model = "claude-opus-5", effort = "max" }
