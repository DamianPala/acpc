name = "Gemini CLI"
author = "Google"
command = "gemini --acp"
install_command = "npm install -g @google/gemini-cli"
home = "~/.gemini"
home_env = "GEMINI_CLI_HOME"
env_passthrough = [
    "GEMINI_API_KEY",
    "GOOGLE_API_KEY",
    "GOOGLE_APPLICATION_CREDENTIALS",
    "GOOGLE_CLOUD_PROJECT",
    "GOOGLE_GEMINI_BASE_URL",
    "GEMINI_MODEL",
    "GEMINI_DEFAULT_AUTH_TYPE",
]
bypass_modes = ["yolo"]
# TODO(stage3): verify live effort support with the adapter.
efforts = []
