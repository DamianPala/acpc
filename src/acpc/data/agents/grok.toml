name = "Grok Build"
author = "xAI"
description = "Grok Build ACP agent (stdio)."
# Multi-word: TUI is bare `grok`; ACP is `grok agent … stdio`.
# --always-approve matches Grok automation docs (skip interactive tool prompts).
command = "grok agent --always-approve stdio"
home = "~/.grok"
home_env = "GROK_HOME"
env_passthrough = [
    "GROK_HOME",
    "XAI_API_KEY",
    "GROK_CODE_XAI_API_KEY",
]

# Grok does not implement session/set_config_option (Method not found).
# Model: ACP session/set_model (verified 2026-08-12). Effort: CLI flag at spawn
# (--reasoning-effort); set_model's reasoningEffort field is ignored on the wire.
model_via = "set_model"
effort_via = "cli"
effort_cli_flag = "--reasoning-effort"
efforts = ["low", "medium", "high", "xhigh"]

# probe --discover advertises 0 modes (no ACP modes on session/new). Ids from
# product docs (permissions); grants/delegates ASSUMED, not measured on disk.
# set_session_mode accepts these ids; ceiling measurement is still open.
[modes]
default = { grants = "read", delegates = true }
acceptEdits = { grants = "edit", delegates = true }
plan = { grants = "edit", delegates = true }
auto = { grants = "all", delegates = false, escalates = true }
dontAsk = { grants = "none", delegates = false }
bypassPermissions = { grants = "all", delegates = false }
"always-approve" = { grants = "all", delegates = false }

[presets]
# Live catalogue 2026-08-12: grok-4.6 (default), grok-4.5.
fast = { model = "grok-4.5", effort = "low" }
standard = { model = "grok-4.6", effort = "high" }
max = { model = "grok-4.6", effort = "xhigh" }
